name: Build Kernel Modules

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: >
          Platforms to build, separated by commas or spaces (e.g. "apollolake, geminilake").
          Use "all" for every platform Synology currently publishes sources for.
        type: string
        default: all
      dsm:
        description: DSM version to build from, e.g. "7.2". Leave blank for the newest sources.
        type: string
        default: ""
      include_legacy:
        description: Also build 3.x-kernel platforms with Dockerfile_legacy (experimental; no overlay.ko on 3.x)
        type: boolean
        default: false
      open_pr:
        description: Open a pull request that updates compiled_modules/ with the new builds
        type: boolean
        default: false
  # Weekly check for new Synology sources. Only platforms whose toolchain or kernel
  # source changed since compiled_modules/sources.json are rebuilt, and a PR is opened.
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - Dockerfile
      - Dockerfile_legacy
      - entrypoint.sh
      - apply_patches.sh
      - discover_platforms.py
      - .github/scripts/**
      - config_modification.json
      - .github/workflows/build-modules.yml
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile_legacy
      - entrypoint.sh
      - apply_patches.sh
      - discover_platforms.py
      - .github/scripts/**
      - config_modification.json
      - .github/workflows/build-modules.yml

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: build-modules-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Select platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.changed.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Discover platforms from Synology's archive
        env:
          DSM_VERSION: ${{ inputs.dsm }}
        run: |
          python3 discover_platforms.py ${DSM_VERSION:+--dsm "$DSM_VERSION"} \
            --summary "$RUNNER_TEMP/platforms.md" > discovered_platforms.json
          {
            echo "## Platforms in Synology's archive${DSM_VERSION:+ (DSM $DSM_VERSION)}"
            echo
            cat "$RUNNER_TEMP/platforms.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build matrix
        id: select
        env:
          REQUESTED: ${{ inputs.platforms || 'all' }}
          INCLUDE_LEGACY: ${{ inputs.include_legacy || false }}
        run: bash .github/scripts/select-platforms.sh discovered_platforms.json "$REQUESTED" "$INCLUDE_LEGACY" >> "$GITHUB_OUTPUT"

      # Scheduled runs skip platforms whose sources match what compiled_modules/ was built from.
      - name: Skip unchanged platforms
        id: changed
        env:
          INCLUDE: ${{ steps.select.outputs.include }}
          ONLY_CHANGED: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$ONLY_CHANGED" != true ]; then
            echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          built=$(cat compiled_modules/sources.json 2>/dev/null || echo '{}')
          include=$(jq -c --argjson built "$built" --slurpfile found discovered_platforms.json \
            'map(select(.platform as $p | $built[$p] != $found[0][$p]))' <<< "$INCLUDE")
          {
            echo "## Platforms with new sources"
            echo
            if [ "$include" = "[]" ]; then
              echo "None. compiled_modules/ is up to date."
            else
              jq -r '.[] | "- \(.platform)"' <<< "$include"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "include=$include" >> "$GITHUB_OUTPUT"

      # Every build job uses this exact list, so all platforms build from the same sources.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: discovered-platforms
          path: discovered_platforms.json
          if-no-files-found: error

  build:
    name: ${{ matrix.platform }} (${{ matrix.kver }})
    needs: matrix
    if: ${{ needs.matrix.outputs.include != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: discovered-platforms

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # The image is the same for every platform, so it is cached between jobs and runs.
      - name: Build compile image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: compile_modules:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

      - name: Compile modules
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p out
          docker run --privileged --rm \
            -v "$PWD/out:/compiled_modules:rw" \
            -v "$PWD/discovered_platforms.json:/synology-toolkit/platforms.json:ro" \
            -e PLATFORM \
            compile_modules:ci
          sudo chown -R "$(id -u):$(id -g)" out

      # entrypoint.sh exits 0 even when make fails, so check the output here.
      - name: Verify modules
        run: bash .github/scripts/verify-modules.sh "out/${{ matrix.kver }}/${{ matrix.platform }}" "${{ matrix.kver }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: modules-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  collect:
    name: Collect modules
    needs: [matrix, build]
    if: ${{ !cancelled() && needs.matrix.outputs.include != '[]' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: modules-*
          merge-multiple: true
          path: compiled_modules

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: discovered-platforms
          path: ${{ runner.temp }}

      # Record of the exact toolchain and kernel source URLs each built platform came from.
      # Scheduled runs compare against this to decide what needs rebuilding.
      - name: Record sources
        run: |
          mkdir -p compiled_modules
          built=$(find compiled_modules -mindepth 2 -maxdepth 2 -type d -printf '%f\n' | jq -R . | jq -sc .)
          jq --argjson built "$built" 'with_entries(select(.key as $k | $built | index($k)))' \
            "$RUNNER_TEMP/discovered_platforms.json" > compiled_modules/sources.json

      - name: Summary
        run: |
          {
            echo "## Compiled modules"
            echo
            echo "| Kernel | Platform | Modules |"
            echo "| --- | --- | --- |"
            for dir in compiled_modules/*/*/; do
              [ -d "$dir" ] || continue
              kver=$(basename "$(dirname "$dir")")
              platform=$(basename "$dir")
              mods=$(find "$dir" -maxdepth 1 -name '*.ko' -printf '%f ' | sort)
              echo "| \`$kver\` | $platform | $mods |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiled_modules
          path: compiled_modules/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, collect]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled_modules
          path: ${{ runner.temp }}/compiled_modules

      # Zips are named <platform>.zip: GitHub renames asset names containing "+",
      # which would break the links in the release notes. The notes give each kernel version.
      - name: Package one zip per platform
        run: |
          modules="$RUNNER_TEMP/compiled_modules"
          mkdir -p dist
          for dir in "$modules"/*/*/; do
            platform=$(basename "$dir")
            (cd "$dir" && zip -j "$GITHUB_WORKSPACE/dist/${platform}.zip" ./*.ko)
          done
          (cd "$modules" && zip -r "$GITHUB_WORKSPACE/dist/all-platforms.zip" .)
          # Record of the exact toolchain and kernel source URLs these modules were built from.
          cp "$modules/sources.json" dist/sources.json
          ls -l dist

      # GitHub's generated changelog (filtered by .github/release.yml) goes under a
      # table of platforms, download links and install steps.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > "$RUNNER_TEMP/changelog.md"
          python3 .github/scripts/release_notes.py \
            --modules "$RUNNER_TEMP/compiled_modules" \
            --sources "$RUNNER_TEMP/compiled_modules/sources.json" \
            --repo "$REPO" --tag "$TAG" \
            --changelog "$RUNNER_TEMP/changelog.md" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          fail_on_unmatched_files: true

  pull-request:
    name: Open PR with modules
    needs: [matrix, build, collect]
    if: >-
      ${{ needs.build.result == 'success' && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.open_pr)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled_modules
          path: ${{ runner.temp }}/compiled_modules

      - name: Write PR description
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          DSM_VERSION: ${{ inputs.dsm }}
        run: |
          new="$RUNNER_TEMP/compiled_modules"
          # Compare with what main was built from, when there's a record of it.
          previous=()
          [ -f compiled_modules/sources.json ] && previous=(--previous compiled_modules/sources.json)
          {
            if [ "$SCHEDULED" = true ]; then
              echo "The weekly check found new Synology sources, so these platforms were rebuilt by [this workflow run]($RUN_URL)."
            else
              src="the newest"
              [ -n "$DSM_VERSION" ] && src="DSM $DSM_VERSION"
              echo "Modules rebuilt by [this workflow run]($RUN_URL) from $src sources."
            fi
            echo
            python3 .github/scripts/release_notes.py --modules "$new" --sources "$new/sources.json" "${previous[@]}"
            echo
            echo "Each module's \`vermagic\` was checked against the platform's kernel. They have only been compiled, not tested on hardware."
            echo "\`compiled_modules/sources.json\` records the exact toolchain and kernel source each platform was built from."
          } > "$RUNNER_TEMP/pr-body.md"

      # A run may only rebuild some platforms, so keep the other platforms' entries in sources.json.
      - name: Merge into compiled_modules/
        run: |
          new="$RUNNER_TEMP/compiled_modules"
          old=compiled_modules/sources.json
          mkdir -p compiled_modules
          [ -f "$old" ] || echo '{}' > "$old"
          jq -s '.[0] + .[1]' "$old" "$new/sources.json" > "$RUNNER_TEMP/sources.json"
          cp -r "$new"/. compiled_modules/
          mv "$RUNNER_TEMP/sources.json" "$old"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: compiled_modules/**
          branch: ci/compiled-modules
          delete-branch: true
          commit-message: "chore: update compiled modules"
          title: "chore: update compiled modules"
          body-path: ${{ runner.temp }}/pr-body.md
